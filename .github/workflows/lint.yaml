name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PRE_COMMIT_VERSION: 4.6.2

jobs:
  pre-commit:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install pinned validation tools
        run: python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}" "mcp-proxy==0.12.0" "mcp==1.30.0"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Test restart dispatch
        run: make test-restart

      - name: Test restart backoff and failed-spawn recovery
        run: make test-backoff

      - name: Test process group cleanup
        run: make test-orphan

      - name: Test fixed-context Kubernetes wrapper
        run: make test-kubernetes

      - name: Test shared GitHub launcher and HTTP sessions
        run: make test-github
